<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact — Fault Lines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300;1,8..60,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a; --surface: #111111; --surface2: #161616;
      --border: #242424; --text: #f0ece4; --text-secondary: #888880;
      --text-muted: #555550; --accent: #c41e1e;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; line-height: 1.7; overflow-x: hidden; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 1000; opacity: 0.4;
    }
    a { color: inherit; text-decoration: none; }
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 48px; height: 64px;
      background: rgba(10,10,10,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-wordmark { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; }
    .nav-wordmark span { color: var(--accent); }
    .nav-links { display: flex; gap: 36px; list-style: none; }
    .nav-links a { font-family: 'Space Mono', monospace; font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-secondary); transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--text); }

    .page-header { padding: 140px 48px 60px; border-bottom: 1px solid var(--border); animation: fadeUp 0.9s ease both; }
    .page-label { font-family: 'Space Mono', monospace; font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
    .page-label::after { content: ''; display: block; width: 40px; height: 1px; background: var(--accent); }
    .page-title { font-family: 'Playfair Display', serif; font-size: clamp(2.4rem, 5vw, 4rem); font-weight: 900; line-height: 1.1; }

    .contact-content {
      max-width: 640px;
      margin: 0 auto;
      padding: 80px 48px;
      animation: fadeUp 0.9s 0.15s ease both;
    }

    .contact-content p {
      font-size: 1.05rem;
      color: var(--text-secondary);
      font-weight: 300;
      margin-bottom: 48px;
      line-height: 1.75;
    }

    .form-group {
      margin-bottom: 28px;
    }

    .form-group label {
      display: block;
      font-family: 'Space Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Source Serif 4', serif;
      font-size: 1rem;
      padding: 14px 18px;
      outline: none;
      transition: border-color 0.2s;
      resize: none;
      appearance: none;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: var(--accent);
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: var(--text-muted);
    }

    .form-group textarea { height: 160px; }

    .submit-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
      border: 1px solid var(--accent);
      background: transparent;
      padding: 16px 28px;
      cursor: pointer;
      transition: all 0.25s;
      margin-top: 8px;
    }

    .submit-btn:hover {
      background: var(--accent);
      color: var(--text);
    }

    .submit-btn .arrow { transition: transform 0.25s; }
    .submit-btn:hover .arrow { transform: translateX(4px); }

    footer { padding: 40px 48px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border); margin-top: 40px; }
    .footer-wordmark { font-family: 'Playfair Display', serif; font-size: 0.95rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    .footer-wordmark span { color: var(--accent); }
    .footer-copy { font-family: 'Space Mono', monospace; font-size: 0.62rem; letter-spacing: 0.08em; color: var(--text-muted); }
    .footer-links { display: flex; gap: 28px; list-style: none; }
    .footer-links a { font-family: 'Space Mono', monospace; font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); transition: color 0.2s; }
    .footer-links a:hover { color: var(--text); }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 900px) {
      nav { padding: 0 24px; }
      .page-header { padding: 120px 24px 48px; }
      .contact-content { padding: 48px 24px; }
      footer { flex-direction: column; gap: 20px; text-align: center; padding: 32px 24px; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-wordmark">Fault<span>Lines</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="blog.html">Analysis</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>

  <header class="page-header">
    <div class="page-label">Get In Touch</div>
    <h1 class="page-title">Contact</h1>
  </header>

  <div class="contact-content">
    <p>For pitches, collaborations, feedback, or anything else — use the form below. All messages are read.</p>

    <form action="mailto:your@email.com" method="POST" enctype="text/plain">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" placeholder="Name" required />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required />
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <select id="subject" name="subject">
          <option value="general">General Enquiry</option>
          <option value="pitch">Article Pitch</option>
          <option value="collaboration">Collaboration</option>
          <option value="feedback">Feedback</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Your message..." required></textarea>
      </div>

      <button type="submit" class="submit-btn">Send Message <span class="arrow">→</span></button>
    </form>
  </div>

  <footer>
    <div class="footer-wordmark">Fault<span>Lines</span></div>
    <p class="footer-copy">© 2025 Fault Lines. Independent analysis.</p>
    <ul class="footer-links">
      <li><a href="blog.html">Analysis</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </footer>
</body>
</html>
